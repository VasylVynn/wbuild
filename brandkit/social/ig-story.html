<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1080px;height:1920px;">
  <img class="bgimg" src="bg-ig.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:100px 90px 260px;">
    <div class="logo-row" style="margin-top:120px;justify-content:center;">
      <img src="../logo/3minsite-mark-2048.png" alt="" style="height:56px;width:56px;">
      <span class="name" style="font-size:34px;">3min<span class="site">site</span></span>
    </div>
    <h1 class="brand" style="margin-top:48px;font-size:76px;font-weight:600;line-height:1.12;letter-spacing:-0.02em;max-width:860px;">
      Сайт із вашого Instagram — за <span class="hl"><span class="z">~3 хвилини</span><span class="u"></span></span>
    </h1>
    <p style="margin-top:30px;font-size:33px;line-height:1.45;color:var(--muted);font-weight:600;max-width:720px;">
      Реальний приклад: сайт квіткової майстерні, зібраний із профілю.
    </p>
    <div class="phone" style="width:400px;margin-top:56px;">
      <div class="notch"></div>
      <img src="site-mobile-top.png" alt="">
    </div>
    <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:18px;">
      <span class="pill" style="font-size:30px;background:var(--ink);color:#fff;border:none;">3minsite.com.ua — спробуйте безкоштовно</span>
      <span style="font-size:26px;color:var(--muted);font-weight:700;">👆 посилання нижче</span>
    </div>
  </div>
</div>
</body></html>

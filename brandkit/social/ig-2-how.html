<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1080px;height:1350px;background:var(--cream);">
  <img class="bgimg" src="bg-abs-ig.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 80px;">
    <div class="logo-row">
      <img src="../logo/3minsite-mark-2048.png" alt="">
      <span class="name">3min<span class="site">site</span></span>
    </div>
    <h1 class="brand" style="margin-top:250px;font-size:66px;font-weight:600;line-height:1.14;letter-spacing:-0.02em;">
      Як це працює
    </h1>
    <div style="margin-top:52px;display:flex;flex-direction:column;gap:30px;max-width:900px;">
      <div style="display:flex;gap:26px;align-items:flex-start;background:#fff;border:1px solid rgba(34,24,17,0.10);border-radius:28px;padding:34px 38px;box-shadow:0 12px 32px rgba(51,41,28,0.08);">
        <span class="brand" style="font-size:44px;font-weight:600;color:var(--honey);line-height:1;">1</span>
        <div><p style="font-size:33px;font-weight:800;">Надішліть посилання на Instagram</p>
        <p style="margin-top:8px;font-size:27px;color:var(--muted);font-weight:600;line-height:1.4;">Помічник сам візьме фото, послуги й контакти</p></div>
      </div>
      <div style="display:flex;gap:26px;align-items:flex-start;background:#fff;border:1px solid rgba(34,24,17,0.10);border-radius:28px;padding:34px 38px;box-shadow:0 12px 32px rgba(51,41,28,0.08);">
        <span class="brand" style="font-size:44px;font-weight:600;color:var(--honey);line-height:1;">2</span>
        <div><p style="font-size:33px;font-weight:800;">Отримайте готовий сайт за ~3 хвилини</p>
        <p style="margin-top:8px;font-size:27px;color:var(--muted);font-weight:600;line-height:1.4;">Тексти, кольори й фото — під ваш бізнес</p></div>
      </div>
      <div style="display:flex;gap:26px;align-items:flex-start;background:#fff;border:1px solid rgba(34,24,17,0.10);border-radius:28px;padding:34px 38px;box-shadow:0 12px 32px rgba(51,41,28,0.08);">
        <span class="brand" style="font-size:44px;font-weight:600;color:var(--honey);line-height:1;">3</span>
        <div><p style="font-size:33px;font-weight:800;">Приймайте заявки в Telegram</p>
        <p style="margin-top:8px;font-size:27px;color:var(--muted);font-weight:600;line-height:1.4;">Кожен клієнт із сайту — одразу у вашому месенджері</p></div>
      </div>
    </div>
    <div style="margin-top:auto;"><span class="brand" style="font-size:34px;font-weight:600;">3minsite.com.ua</span></div>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1080px;height:1350px;">
  <img class="bgimg" src="bg-abs-ig.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 80px;">
    <div class="logo-row">
      <img src="../logo/3minsite-mark-2048.png" alt="" style="height:52px;width:52px;">
      <span class="name">3min<span class="site">site</span></span>
    </div>
    <h1 class="brand" style="margin-top:310px;font-size:72px;font-weight:600;line-height:1.12;letter-spacing:-0.02em;max-width:620px;">
      Сайт із вашого Instagram — за <span class="hl"><span class="z">~3 хвилини</span><span class="u"></span></span>
    </h1>
    <p style="margin-top:28px;font-size:31px;line-height:1.45;color:var(--muted);font-weight:600;max-width:540px;">
      Цей сайт квіткової майстерні помічник зібрав сам — із фото, послуг і контактів профілю.
    </p>
    <div style="margin-top:44px;display:flex;flex-direction:column;align-items:flex-start;gap:18px;">
      <span class="pill" style="font-size:26px;"><span class="dot"></span>Публікація безкоштовна</span>
      <span class="pill" style="font-size:26px;"><span class="dot"></span>Заявки — у ваш Telegram</span>
    </div>
    <div style="margin-top:auto;">
      <span class="brand" style="font-size:34px;font-weight:600;">3minsite.com.ua</span>
    </div>
  </div>
  <div class="phone" style="position:absolute;right:52px;bottom:-30px;width:368px;transform:rotate(4deg);">
    <div class="notch"></div>
    <img src="site-mobile-top.png" alt="">
  </div>
</div>
</body></html>

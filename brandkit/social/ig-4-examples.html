<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1080px;height:1350px;">
  <img class="bgimg" src="bg-abs-ig.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:70px 80px;">
    <div class="logo-row">
      <img src="../logo/3minsite-mark-2048.png" alt="" style="height:52px;width:52px;">
      <span class="name">3min<span class="site">site</span></span>
    </div>
    <h1 class="brand" style="margin-top:56px;font-size:64px;font-weight:600;line-height:1.14;letter-spacing:-0.02em;text-align:center;">
      Різні бізнеси —<br>різні сайти
    </h1>
    <p style="margin-top:20px;font-size:30px;line-height:1.45;color:var(--muted);font-weight:600;text-align:center;">
      Кольори, шрифти й тексти — помічник добирає під вашу нішу.
    </p>
    <div style="margin-top:56px;display:flex;justify-content:center;align-items:flex-start;">
      <div class="phone" style="width:300px;transform:rotate(-5deg) translateY(26px);z-index:1;">
        <div class="notch" style="width:70px;height:16px;top:6px;"></div>
        <img src="site-tepla-pich.png" alt="">
      </div>
      <div class="phone" style="width:310px;margin:0 -34px;z-index:3;">
        <div class="notch" style="width:70px;height:16px;top:6px;"></div>
        <img src="site-skazheni-vusa.png" alt="">
      </div>
      <div class="phone" style="width:300px;transform:rotate(5deg) translateY(26px);z-index:2;">
        <div class="notch" style="width:70px;height:16px;top:6px;"></div>
        <img src="site-avtomaister.png" alt="">
      </div>
    </div>
    <div style="position:absolute;left:0;right:0;bottom:64px;display:flex;justify-content:center;">
      <span class="pill" style="font-size:28px;background:var(--ink);color:#fff;border:none;">3minsite.com.ua — спробуйте безкоштовно</span>
    </div>
  </div>
</div>
</body></html>

<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1080px;height:1350px;">
  <img class="bgimg" src="bg-abs-ig.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:90px 90px;">
    <div class="logo-row" style="margin-top:270px;justify-content:center;">
      <img src="../logo/3minsite-mark-2048.png" alt="" style="height:64px;width:64px;">
    </div>
    <h1 class="brand" style="margin-top:36px;font-size:70px;font-weight:600;line-height:1.14;letter-spacing:-0.02em;">
      Скільки це коштує?
    </h1>
    <p style="margin-top:34px;font-size:38px;line-height:1.5;font-weight:700;">
      Створення і публікація —<br><span class="hl"><span class="z">безкоштовно</span><span class="u"></span></span>
    </p>
    <p style="margin-top:26px;font-size:30px;line-height:1.5;color:var(--muted);font-weight:600;max-width:760px;">
      Власний домен — 999 грн/рік, коли будете готові. Жодних підписок і прихованих платежів.
    </p>
    <div style="margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:20px;">
      <span class="pill" style="font-size:29px;background:var(--ink);color:#fff;border:none;">Спробуйте — 3minsite.com.ua</span>
    </div>
  </div>
</div>
</body></html>

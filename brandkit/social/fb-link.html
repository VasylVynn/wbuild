<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card-base.css"></head>
<body>
<div class="card" style="width:1200px;height:630px;">
  <img class="bgimg" src="bg-abs-fb.png" alt="">
  <div style="position:absolute;inset:0;display:flex;flex-direction:column;padding:56px 64px;">
    <div class="logo-row" style="gap:11px;">
      <img src="../logo/3minsite-mark-2048.png" alt="" style="height:36px;width:36px;">
      <span class="name" style="font-size:24px;">3min<span class="site">site</span></span>
    </div>
    <h1 class="brand" style="margin-top:64px;font-size:52px;font-weight:600;line-height:1.14;letter-spacing:-0.02em;max-width:660px;">
      Сайт із вашого Instagram — щоб вас знаходили в <span class="hl"><span class="z">Google</span><span class="u"></span></span>
    </h1>
    <p style="margin-top:22px;font-size:25px;line-height:1.45;color:var(--muted);font-weight:600;max-width:600px;">
      Помічник збере його за ~3 хвилини. Заявки клієнтів — у ваш Telegram.
    </p>
    <div style="margin-top:auto;">
      <span class="pill" style="font-size:22px;"><span class="dot"></span>3minsite.com.ua — спробуйте безкоштовно</span>
    </div>
  </div>
  <div class="phone" style="position:absolute;right:74px;top:64px;width:300px;transform:rotate(3deg);">
    <div class="notch"></div>
    <img src="site-mobile-top.png" alt="">
  </div>
</div>
</body></html>
